# 本地开发依赖：只放基础设施，不放应用本身（应用用 go run 或 IDE 调试）。
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: {{SERVICE}}
      # 本地应用账号：拥有本库全部权限，仅供开发；应用运行时禁止使用 root
      MYSQL_USER: {{SERVICE}}
      MYSQL_PASSWORD: dev
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # $$ 是 compose 的转义，容器内取它自己的环境变量
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysqldata:
