openapi: 3.1.0
info:
  title: {{SERVICE}}
  version: 0.1.0
  description: |
    对外契约的唯一来源。改动本文件必须同步 internal/ 下的 handler 与测试。

servers:
  - url: http://localhost:8080

paths:
  /healthz:
    get:
      summary: 存活探针
      operationId: getHealthz
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok

  /readyz:
    get:
      summary: 就绪探针（检查数据库）
      operationId: getReadyz
      responses:
        "200":
          description: 依赖可用
        "503":
          description: 依赖不可用

  /v1/users:
    get:
      summary: 分页列出用户
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  limit:
                    type: integer
                  offset:
                    type: integer
        "422":
          $ref: "#/components/responses/Invalid"

    post:
      summary: 创建用户
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"

  /v1/users/{id}:
    get:
      summary: 按 ID 获取用户
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"

components:
  schemas:
    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Invalid:
      description: 入参不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
